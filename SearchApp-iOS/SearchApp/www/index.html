<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>بنك المعلومات</title>
<style>
:root{--navy:#0b2545;--navy2:#13315c;--gold:#c9a227;--bg:#eef1f6;--card:#fff;--text:#14213d;--muted:#5c6b82;--line:#d9dfe9;--mark:#ffe58a}
.pgr{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0}.pgr button{min-width:40px;padding:9px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;color:var(--navy)}.pgr button.on{background:var(--navy);color:#fff;border-color:var(--gold)}.pgr span{padding:9px 2px;color:var(--muted)}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--muted);min-width:90px;font-size:13px}.kv b{font-weight:600;word-break:break-word}.res{cursor:pointer}
.srow,.frow{display:flex;gap:6px;margin-bottom:6px;align-items:center}.srow input,.frow input,.frow select{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.srow button,.frow button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font-size:15px}.frow{flex-wrap:wrap;margin-top:8px}.frow input{flex:2 1 160px}.frow select{flex:1 1 110px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
#wm{position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(logo.png) center 55%/min(80vw,520px) no-repeat;opacity:.09}
.card{background:rgba(255,255,255,.93)!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Tahoma,sans-serif;line-height:1.6}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:12px}
.top img{height:42px}.shield{font-size:30px}
.top h1{font-size:17px;margin:0}.top small{color:#c8d3e6;display:block;font-size:12px}
.top button{margin-inline-start:auto;border:1px solid var(--gold);background:none;color:var(--gold);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px}
.wrap{max-width:780px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
#login{max-width:380px;margin:60px auto;text-align:center}
#login h2{margin:6px 0 14px;color:var(--navy)}
input[type=password],input[type=search]{width:100%;font:inherit;font-size:17px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
.btn{width:100%;margin-top:12px;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:700;padding:13px;border-radius:10px;border-bottom:3px solid var(--gold)}
.btn:disabled{opacity:.5}
#err{color:#b3261e;min-height:22px;margin-top:8px;font-size:14px}#prog{color:var(--muted);font-size:14px;margin-top:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--muted);font:inherit;font-size:13px;padding:7px 12px}
.seg button.on{background:var(--navy);color:#fff}
select{font:inherit;font-size:13px;padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}.chip{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px}.chip.on{background:var(--navy);color:#fff;border-color:var(--gold)}.lab{font-size:12px;color:var(--muted);margin:10px 0 4px}
.nav{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;border:1px solid var(--line);background:#fff;padding:10px;font:inherit;border-radius:10px;color:var(--navy)}.tab.on{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:20px;color:var(--navy)}
.sec{margin-bottom:12px;padding:12px}.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--navy)}.sh span{font-size:12px;color:var(--muted)}
.fl{display:flex;justify-content:space-between;width:100%;border:0;background:#f4f6fa;margin-top:6px;padding:11px 12px;border-radius:8px;font:inherit;font-size:14px;color:var(--text);text-align:start}.fl em{font-style:normal;color:var(--muted);font-size:12px}
.back{border:0;background:none;color:var(--navy);font:inherit;font-weight:700;padding:6px 0;margin-bottom:6px}
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:62vh}table.dt{border-collapse:collapse;width:max-content;min-width:100%}.dt th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:12px;padding:8px;white-space:nowrap}.dt td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}.dt td.n{color:var(--muted);font-size:11px}
.pg{display:flex;justify-content:space-between;margin-top:10px}.pg button{border:0;background:var(--navy);color:#fff;font:inherit;padding:10px 18px;border-radius:8px}.pg button:disabled{opacity:.35}
.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 2px 4px}
.res{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin:8px 0}
.src{font-size:12px;color:var(--navy2);font-weight:700;margin-bottom:5px;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px 14px}
.cell{font-size:14px;word-break:break-word}.cell span{display:block;color:var(--muted);font-size:11px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:30px}

/* ===== النسخة 10: تصميم احترافي ===== */
:root{--navy:#081a33;--navy2:#0f2c55;--gold:#d4af37;--gold2:#f1d77a;--bg:#eaeef5;--shadow:0 6px 22px rgba(8,26,51,.10)}
body{background:radial-gradient(1200px 500px at 50% -120px,#dfe7f5,var(--bg));font-family:"Segoe UI",Tahoma,system-ui,sans-serif}
.top{background:linear-gradient(135deg,var(--navy),var(--navy2) 70%);box-shadow:0 4px 18px rgba(0,0,0,.25);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.top h1{font-size:18px;letter-spacing:.2px}
.card{border-radius:16px;box-shadow:var(--shadow);border:1px solid #dfe5ef}
.btn{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:12px;box-shadow:0 4px 12px rgba(8,26,51,.25);transition:transform .15s}
.btn:active{transform:scale(.97)}
.tab{border-radius:12px;font-weight:600;box-shadow:0 2px 6px rgba(8,26,51,.06);transition:all .2s}
.tab.on{background:linear-gradient(135deg,var(--navy),var(--navy2));box-shadow:0 4px 12px rgba(8,26,51,.3)}
.kpi{border-radius:14px;box-shadow:var(--shadow);border-top:3px solid var(--gold)}
.kpi b{font-size:22px;background:linear-gradient(135deg,var(--navy),var(--navy2));-webkit-background-clip:text;background-clip:text;color:transparent}
.res{border-radius:14px;box-shadow:var(--shadow);transition:transform .15s}
.res:active{transform:scale(.99)}
.chip{box-shadow:0 2px 6px rgba(8,26,51,.06)}
.wrap{max-width:1100px}
/* الأقسام: كلها في صف واحد جنب بعض مع تمرير أفقي */
#vHome .secrow{display:flex;flex-direction:row;gap:12px;overflow-x:auto;align-items:flex-start;padding:2px 2px 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
#vHome .secrow .sec{flex:0 0 min(86vw,340px);margin:0;scroll-snap-align:start;max-height:68vh;overflow-y:auto}
#vHome .secrow::-webkit-scrollbar{height:6px}#vHome .secrow::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
@media(min-width:900px){#vHome .secrow .sec{flex:1 1 0;min-width:280px}}
/* شاشة القفل */
#login{max-width:400px;margin:40px auto;padding:26px 22px;background:linear-gradient(180deg,#fff,#f4f7fc)!important;border-top:4px solid var(--gold)}
#login h2{font-size:22px}
#bio{width:100%;margin-top:12px;border:2px solid var(--gold);background:#fffdf3;color:var(--navy);font:inherit;font-weight:700;padding:13px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
#bio[hidden]{display:none}
.bioon{display:flex;align-items:center;justify-content:space-between;background:#f4f6fa;border-radius:12px;padding:10px 12px;margin-top:8px}
.bioon label{font-size:14px;color:var(--navy)}
/* حقوق المبرمج */
#copy{margin:26px auto 18px;text-align:center;font-size:12.5px;color:var(--muted);padding:12px;max-width:420px;border-top:1px solid var(--line)}
#copy b{color:var(--navy);display:block;font-size:14px;margin-top:2px}
#copy .g{color:var(--gold);font-size:16px}
/* تحديث */
#updb{position:fixed;inset:auto 12px 12px 12px;z-index:50;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:2px solid var(--gold);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
#updb b{color:var(--gold2)}#updb .r{display:flex;gap:8px;margin-top:10px}
#updb button{flex:1;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700}
#updb .ok{background:var(--gold);color:var(--navy)}#updb .no{background:rgba(255,255,255,.15);color:#fff}

#dsr[hidden]{display:none!important}
/* ===== النسخة 11: خلفية متحركة + شعارات + بحث تفصيلي ===== */
#bgfx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:radial-gradient(1000px 600px at 80% -10%,#16396b 0%,transparent 60%),radial-gradient(900px 600px at 0% 110%,#0d2a52 0%,transparent 55%),linear-gradient(160deg,#050f1f,#0a2142 55%,#071a35)}
#bgfx .grid{position:absolute;inset:-50%;background-image:linear-gradient(rgba(212,175,55,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.07) 1px,transparent 1px);background-size:46px 46px;transform:perspective(600px) rotateX(60deg);animation:gmove 14s linear infinite}
@keyframes gmove{from{background-position:0 0}to{background-position:0 460px}}
#bgfx .mk{position:absolute;left:50%;top:50%;width:min(95vw,640px);opacity:.07;transform:translate(-50%,-50%);animation:spin 90s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#bgfx .sh{position:absolute;left:50%;top:52%;width:min(70vw,420px);opacity:.06;transform:translate(-50%,-50%);animation:pulse 7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.05;transform:translate(-50%,-50%) scale(1)}50%{opacity:.11;transform:translate(-50%,-50%) scale(1.05)}}
#bgfx i{position:absolute;bottom:-12px;width:3px;height:3px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0)}10%{opacity:.9}100%{opacity:0;transform:translateY(-105vh)}}
#bgfx .scan{position:absolute;left:0;right:0;height:140px;background:linear-gradient(180deg,transparent,rgba(212,175,55,.08),transparent);animation:scan 9s ease-in-out infinite}
@keyframes scan{0%{top:-160px}100%{top:100%}}
body{background:transparent!important}
#wm{display:none}
.card{background:rgba(255,255,255,.95)!important;backdrop-filter:blur(6px)}
.top{background:linear-gradient(135deg,rgba(5,15,31,.96),rgba(15,44,85,.96))}
.top .lg2{height:46px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
#login .lgs{display:flex;justify-content:center;align-items:center;gap:18px;margin-bottom:6px}
#login .lgs img{height:92px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));animation:flt 5s ease-in-out infinite}
#login .lgs img+img{animation-delay:-2.5s}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#login .ttl{font-size:13px;color:var(--muted);margin:0 0 12px}
#copy{color:#c8d3e6;border-top-color:rgba(255,255,255,.15)}#copy b{color:var(--gold2)}
#dsr{margin-top:10px}
#dsr .dr{display:flex;gap:6px;margin-bottom:6px;align-items:center}
#dsr .dr select{flex:0 0 38%;max-width:38%;font:inherit;font-size:14px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}
#dsr .dr input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}
#dsr .dr button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:15px}
#dsr .add{border:1px dashed var(--navy);background:none;color:var(--navy);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;margin-top:2px}
.kvf{background:linear-gradient(135deg,#fff,#faf6e6);border-radius:10px;padding:8px 10px;margin:4px 0;border-inline-start:4px solid var(--gold)}
#dsr .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#dsr .dc span{display:block;font-size:12px;color:var(--navy2);font-weight:700;margin-bottom:2px}
#dsr .dc input{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
#dsr .dc input:focus{outline:2px solid var(--gold);border-color:var(--gold)}

/* ===== النسخة 12: زجاج شفاف + منع التمدد الجانبي + بحث مرتب ===== */
html{overflow-x:hidden}body{overflow-x:clip;max-width:100%}
#bgfx{contain:paint;width:100%;height:100%}#bgfx .grid{display:block}#bgfx .mk{opacity:.12}
.wrap,#app,#vSearch,#vHome,#vFile,#vAdm,#vRec{min-width:0;max-width:100%}
:root{--text:#eaf1ff;--muted:#a9b9d6;--line:rgba(255,255,255,.2);--card:transparent}
.card,#login,.res,.kpi,.tw{background:rgba(8,26,51,.32)!important;backdrop-filter:blur(7px) saturate(1.15);-webkit-backdrop-filter:blur(7px) saturate(1.15);border:1px solid rgba(255,255,255,.16)!important;color:var(--text)}
.res{border-inline-start:4px solid var(--gold)!important}.kpi{border-top:3px solid var(--gold)!important;color:var(--muted)}
#login h2,.sh,.card h3{color:#fff!important}.back{color:var(--gold2)}
input[type=password],input[type=search],select,.srow input,.frow input,.frow select,#dsr .dc input{background:rgba(255,255,255,.08)!important;color:#fff!important;border:1px solid rgba(255,255,255,.22)!important}
::placeholder{color:rgba(255,255,255,.5)!important}option{background:#0f2c55;color:#fff}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)!important}
.chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.28);color:#eaf1ff}
.chip.on{background:linear-gradient(135deg,#d4af37,#f1d77a);color:#081a33;border-color:#f1d77a;font-weight:700}
.tab{background:rgba(255,255,255,.08)!important;color:#eaf1ff;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.tab.on{background:linear-gradient(135deg,rgba(15,44,85,.95),rgba(8,26,51,.95))!important;color:#fff;border-bottom:3px solid var(--gold)}
.kpi b{background:linear-gradient(135deg,#f1d77a,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent}
.fl{background:rgba(255,255,255,.07);color:var(--text)}.kvf{background:rgba(255,255,255,.06)}
.src{color:var(--gold2)}.dt td{color:var(--text)}
.seg{border-color:rgba(255,255,255,.25)}.seg button{background:transparent;color:var(--muted)}
.seg button.on{background:linear-gradient(135deg,#d4af37,#f1d77a);color:#081a33;font-weight:700}
.pgr button,.srow button,.frow button{background:rgba(255,255,255,.08);color:#fff}.pgr button.on{background:var(--gold);color:#081a33}
.pg button{background:rgba(255,255,255,.14)}
#bio{background:rgba(212,175,55,.12);color:var(--gold2)}.bioon{background:rgba(255,255,255,.07)}.bioon label{color:var(--text)}
#err{color:#ff9e94}mark{background:#ffe58a;color:#14213d}
#vAdm [style*="background:#fff"]{background:rgba(255,255,255,.08)!important}
/* ترتيب صفحة البحث */
#vSearch .chips{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#vSearch .chips::-webkit-scrollbar{display:none}
#vSearch .chip{flex:0 0 auto;white-space:nowrap;padding:5px 12px;font-size:13px}
#vSearch .lab{margin:2px 0 6px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ctl .seg{flex:0 0 auto}.ctl select{flex:1 1 120px;min-width:0;font:inherit;font-size:14px;padding:8px;border-radius:10px}
.ctl input{flex:1 1 100%;min-width:0;font:inherit;font-size:14px;padding:9px;border-radius:10px}
#dsr summary{cursor:pointer;font-weight:700;color:var(--gold2);margin-bottom:8px;list-style:none}
#dsr summary::-webkit-details-marker{display:none}
#dsr .dgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:620px){#dsr .dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
#dsr .dc span{color:var(--gold2)}
#dsr .add{border-color:rgba(255,255,255,.35);color:#fff;margin-top:10px}
</style></head><body>

<script>
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var reEsc=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")};

var CFG={title:"بنك المعلومات",sub:"وزارة الداخلية — مكافحة إجرام شرق الأنبار"};
var KEY=null,MAN=null,META=null,ORD=[],ISDEV=false,dirty=false,xlP=null;
function applyCfg(){$("t").textContent=CFG.title||"";$("st").textContent=CFG.sub||"";document.title=CFG.title||"البحث"}
function b2u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})}
function u2b(u){var s="";for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
async function dk(pw,salt,iter){var m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function dec(key,buf){var u=new Uint8Array(buf);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12));return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
async function enc(key,s){var z=new Uint8Array(await new Response(new Blob([s]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());var iv=crypto.getRandomValues(new Uint8Array(12));var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,z));var o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
function syncOrd(){DB.forEach(function(d){if(ORD.indexOf(d.group)<0)ORD.push(d.group)})}

    var salt=crypto.getRandomValues(new Uint8Array(16));META={salt:u2b(salt),iter:200000};KEY=await dk(p,salt,META.iter);
    DB=[];ORD=[];MAN={bundles:[]};dirty=true;enter();adminView();show("vAdm");
  };
}
async function login(){

      $("prog").textContent="تحميل البيانات "+(i+1)+" من "+ids.length;
      var arr=JSON.parse(await dec(KEY,b2u(DATA.b[ids[i]])));
      arr.forEach(addEnt);arr=null;
    }
  }catch(e){$("err").textContent="تعذّر تحميل البيانات.";$("go").disabled=false;return}

}

function loadX(){if(window.XLSX)return Promise.resolve();if(!xlP)xlP=new Promise(function(res,rej){var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=function(){xlP=null;rej(new Error("x"))};document.head.appendChild(s)});return xlP}
function trimWs(ws){var mr=-1,mc=-1;for(var k in ws){if(k.charAt(0)==="!")continue;var c=ws[k];if(!c||c.v===undefined||c.v==="")continue;var a=XLSX.utils.decode_cell(k);if(a.r>mr)mr=a.r;if(a.c>mc)mc=a.c}if(mr<0)return false;ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:mr,c:mc}});return true}

  +'<div class="card" style="margin-top:12px"><h3 '+H+'>الأقسام (رتّب · أعد التسمية · احذف)</h3><div id="secs"></div><div class="srow"><input type="search" id="nsec" placeholder="اسم قسم جديد"><button id="nsb">➕</button></div></div>'

  $("cs").oninput=function(){CFG.sub=$("cs").value;dirty=true;applyCfg()};
  $("nsb").onclick=function(){var v=$("nsec").value.trim();if(!v||ORD.indexOf(v)>-1)return;ORD.push(v);$("nsec").value="";renderSecs();touch()};
  $("secs").onchange=function(e){
    var el=e.target;if(!el.classList.contains("sn"))return;var i=+el.dataset.i,o=ORD[i],n=el.value.trim();

    DB.forEach(function(d){if(d.group===o)d.group=n});ORD[i]=n;renderSecs();listAdm();touch();
  };
  $("secs").onclick=function(e){
    var b=e.target.closest("button");if(!b)return;var d=b.dataset;
    if(d.up!==undefined&&+d.up>0){var i=+d.up,t=ORD[i];ORD[i]=ORD[i-1];ORD[i-1]=t}
    else if(d.dn!==undefined&&+d.dn<ORD.length-1){var j=+d.dn,u=ORD[j];ORD[j]=ORD[j+1];ORD[j+1]=u}
    else if(d.del!==undefined){
      if(!b.dataset.c){b.dataset.c="1";b.textContent="تأكيد؟";return}
      var g=ORD[+d.del],has=DB.some(function(x){return x.group===g});
      if(has){if(g==="بدون قسم"){ast("انقل ملفات «بدون قسم» أولاً.");return}if(ORD.indexOf("بدون قسم")<0)ORD.push("بدون قسم");DB.forEach(function(x){if(x.group===g)x.group="بدون قسم"})}
      ORD.splice(ORD.indexOf(g),1);
    }else return;
    renderSecs();listAdm();touch();
  };
  $("axf").onchange=function(e){addXl(Array.prototype.slice.call(e.target.files));e.target.value=""};
  $("afs").oninput=listAdm;$("asv").onclick=saveAll;$("aex").onclick=exportPack;
  $("afl").onchange=function(e){
    var el=e.target,i=+el.dataset.i;if(isNaN(i))return;
    if(el.classList.contains("fn")){var n=el.value.trim();if(!n||DB.some(function(x,k){return k!==i&&x.name===n})){el.value=DB[i].name;return}DB[i].name=n}
    else if(el.classList.contains("fg"))DB[i].group=el.value;
    touch();
  };
  $("afl").onclick=function(e){
    var b=e.target.closest("button");if(!b||b.dataset.d===undefined)return;
    if(!b.dataset.c){b.dataset.c="1";b.textContent="تأكيد؟";return}
    DB.splice(+b.dataset.d,1);listAdm();touch();
  };
  renderSecs();listAdm();renderUsers();wireAdm2();

function renderSecs(){
  $("secs").innerHTML=ORD.map(function(g,i){return'<div class="srow"><input class="sn" data-i="'+i+'" value="'+esc(g)+'"><button data-up="'+i+'">↑</button><button data-dn="'+i+'">↓</button><button data-del="'+i+'">🗑</button></div>'}).join("")||'<div class="empty" style="padding:8px">أضف قسماً أولاً.</div>';
  $("asel").innerHTML=secOpts(ORD[0]);
}
function listAdm(){
  var q=($("afs").value||"").trim().toLowerCase(),o="",n=0;
  for(var i=0;i<DB.length&&n<30;i++){if(q&&DB[i].name.toLowerCase().indexOf(q)<0)continue;n++;
    o+='<div class="frow"><input class="fn" data-i="'+i+'" value="'+esc(DB[i].name)+'"><select class="fg" data-i="'+i+'">'+secOpts(DB[i].group)+'</select><button data-d="'+i+'">🗑</button></div>'}
  $("afl").innerHTML=o||'<div class="empty" style="padding:8px">لا توجد ملفات'+(q?' مطابقة':'')+'.</div>';

async function addXl(list){
  if(!ORD.length){ast("أضف قسماً أولاً.");return}
  ast("جارٍ تحميل مكتبة القراءة…");
  try{await loadX()}catch(e){ast("تعذّر تحميل مكتبة Excel، تأكد من الإنترنت.");return}
  var g=$("asel").value,ok=0,bad=0;
  for(var i=0;i<list.length;i++){
    var f=list[i];ast("معالجة "+(i+1)+" من "+list.length);
    try{
      var wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),sheets=[];
      wb.SheetNames.forEach(function(n){var ws=wb.Sheets[n];if(!trimWs(ws))return;
        var r=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false}).map(function(x){return x.map(function(c){return String(c).replace(/[\t\r\n]+/g," ")}).join("\t")}).filter(function(t){return t.replace(/\t/g,"")!==""});
        sheets.push({name:n,rows:r})});
      if(!sheets.length){bad++;continue}
      DB=DB.filter(function(d){return d.name!==f.name});DB.push({name:f.name,group:g,sheets:sheets});ok++;
    }catch(e){bad++}
    if(i%5===0)await new Promise(function(r){setTimeout(r,0)});
  }
  listAdm();touch("أُضيف "+ok+" ملف"+(bad?" · تعذّر "+bad:"")+". اضغط «حفظ ونشر».");
}
async function pub(){
  ast("جارٍ التشفير…");$("asv").disabled=true;
  try{
    var out={},ids=[],cur=[],size=0;
    var fl=async function(){if(!cur.length)return;var id="b"+String(ids.length+1).padStart(3,"0");out[id]=u2b(await enc(KEY,JSON.stringify(cur)));ids.push(id);cur=[];size=0};
    for(var i=0;i<DB.length;i++){var d=DB[i];var es=ents(d);for(var q9=0;q9<es.length;q9++){cur.push(es[q9]);es[q9].s.forEach(function(s){s.rows.forEach(function(t){size+=t.length})});if(size>4e6)await fl()}}
    await fl();
    var data={cfg:CFG,meta:META,man:u2b(await enc(KEY,JSON.stringify({bundles:ids,order:ORD}))),b:out};
    var json=JSON.stringify(data).replace(/</g,"\\u003c");
    var html=SRC.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+json+b});
    var mb=html.length/1048576;
    if(mb>15.5){ast("الحجم "+mb.toFixed(1)+" MB يتجاوز حد النشر (16 MB). احذف بعض الملفات أو استخدم نسخة الـ VPS.");$("asv").disabled=false;return}
    ast("جارٍ النشر ("+mb.toFixed(1)+" MB)…");
    var a=await claude.use("artifact");if(!a){ast("النشر غير متاح في هذا العرض.");$("asv").disabled=false;return}
    await a.publish(html);
  }catch(e){
    ast((e&&e.code==="conflict")?"تم تحديث الصفحة من مكان آخر، أعد فتحها.":"تعذّر النشر: "+((e&&e.message)||e));$("asv").disabled=false;
  }
}

function filt(){
  var s=DB[cur.f].sheets[cur.s],q=($("fq").value||"").trim().toLowerCase();cur.p=0;
  if(!q){cur.list=null}else{var ws=q.split(/\s+/),l=[],Lc=lowOf(s);for(var i=1;i<s.rows.length;i++){var t=Lc[i];if(ws.every(w=>t.indexOf(w)>-1))l.push(i)}cur.list=l}
  drawFile();
}
function drawFile(){
  var s=DB[cur.f].sheets[cur.s],head=(s.rows[0]||"").split("\t"),PS=50;
  var total=cur.list?cur.list.length:Math.max(0,s.rows.length-1),pages=Math.max(1,Math.ceil(total/PS));
  cur.p=Math.min(Math.max(cur.p,0),pages-1);
  var h='<table class="dt"><tr><th>#</th>'+head.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr>';
  for(var k=cur.p*PS;k<Math.min(total,(cur.p+1)*PS);k++){var ri=cur.list?cur.list[k]:k+1;h+='<tr><td class="n">'+ri+'</td>'+s.rows[ri].split("\t").map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>'}

  $("fc").textContent=total.toLocaleString("ar")+" سجل";$("fp").textContent="صفحة "+(cur.p+1)+" من "+pages;
  $("pp").disabled=cur.p<=0;$("pn").disabled=cur.p>=pages-1;
}

function search(){
  var q=$("q").value.trim().toLowerCase(),out=$("out");
  var total=0;DB.forEach(function(d){if(grp&&d.group!==grp)return;d.sheets.forEach(function(s){total+=s.rows.length})});
  if(!q){$("count").textContent=total.toLocaleString("ar")+" سجل جاهز للبحث";$("time").textContent="";out.innerHTML='<div class="empty">⌨️ اكتب في خانة البحث لتبدأ</div>';return}
  var t0=performance.now(),words=q.split(/\s+/).filter(Boolean),re=new RegExp("("+words.map(reEsc).join("|")+")","gi");
  var all=mode==="all",fn=($("fnm").value||"").trim().toLowerCase(),html=[],n=0,LIMIT=100;
  DB.forEach(function(d,di){
    if(grp&&d.group!==grp)return;if(fn&&d.name.toLowerCase().indexOf(fn)<0)return;
    d.sheets.forEach(function(s){
      var head=(s.rows[0]||"").split("\t");
      for(var ri=0;ri<s.rows.length;ri++){
        var t=s.rows[ri].toLowerCase(),ok=true;
        if(all){for(var k=0;k<words.length;k++){if(t.indexOf(words[k])<0){ok=false;break}}}
        else{ok=false;for(var k=0;k<words.length;k++){if(t.indexOf(words[k])>-1){ok=true;break}}}
        if(!ok)continue;n++;if(n>LIMIT)continue;
        var cells=s.rows[ri].split("\t").map(function(v,ci){
