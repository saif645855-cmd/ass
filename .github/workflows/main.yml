name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd SearchApp-iOS
          xcodebuild -project SearchApp.xcodeproj -scheme SearchApp -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SearchApp.app Payload/
          zip -qry SearchApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SearchApp-ipa
          path: SearchApp-iOS/SearchApp.ipa
